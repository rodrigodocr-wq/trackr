name: Fix Vercel CRON_SECRET

on:
  workflow_dispatch:

jobs:
  set-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Set CRON_SECRET
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "a00be5a0381cb65ac395232e5b4868ae" | vercel env add CRON_SECRET production \
            --token $VERCEL_TOKEN \
            --scope rodrigodocr-wqs-projects \
            --yes 2>&1 || echo "May already exist, continuing..."

      - name: Redeploy to production  
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel --prod \
            --token $VERCEL_TOKEN \
            --scope rodrigodocr-wqs-projects \
            --yes 2>&1
